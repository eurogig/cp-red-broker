name: Local runner verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: RUN_NETWORK_TESTS=1 npm test
      - name: Safe synthetic lifecycle
        run: DEMO_SAFE=1 npm run demo
      - name: Findings lifecycle and gate
        shell: bash
        run: |
          set +e
          node src/cli.mjs examples/mock.json > receipt.json
          status=$?
          set -e
          test "$status" -eq 1
          report_dir=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("receipt.json")).directory)')
          set +e
          node scripts/consume.mjs "$report_dir"
          status=$?
          set -e
          test "$status" -eq 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-reports
          path: results/
          retention-days: 7
