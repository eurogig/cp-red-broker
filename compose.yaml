services:
  target:
    build: {context: ., target: demo}
    image: checkpoint-red-runner:demo
    entrypoint: ["node", "demo/target.mjs"]
    environment: {HOST: "0.0.0.0", PORT: "8080"}
    networks: [private]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 10
  runner:
    build: {context: ., target: demo}
    image: checkpoint-red-runner:demo
    depends_on: {target: {condition: service_healthy}}
    networks: [private]
    volumes:
      - ./examples/compose.json:/config/runner.json:ro
      - ./results:/results
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 64
    init: true
    restart: "no"
networks:
  private:
    internal: true
